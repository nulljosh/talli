# Local build on Xcode 15.2 (macOS 13): older project format and Swift 5 mode. Not used by CI.
include:
  - project.yml
options:
  projectFormat: xcode15_0
settings:
  SWIFT_VERSION: "5.0"
targets:
  Talli:
    settings:
      base:
        PRODUCT_NAME: Talli
        ASSETCATALOG_COMPILER_APPICON_NAME: ""  # Talli.icon (Icon Composer) needs Xcode 26
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  TalliWidgetsExtension:
    settings:
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  TalliWatch:
    settings:
      SUPPORTED_PLATFORMS: "watchos watchsimulator"
  TalliTests:
    settings:
      base:
        PRODUCT_NAME: TalliTests
  TalliUITests:
    settings:
      base:
        PRODUCT_NAME: TalliUITests
