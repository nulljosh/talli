        <button onClick={()=>setTab('settings')} title="Settings" style={{width:28,height:28,borderRadius:'50%',background:avatarUrl?'transparent':t.accent,overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer',WebkitTapHighlightColor:'transparent',padding:0,animation:refreshing?'spin 0.8s linear infinite':'none'}}>
          {avatarUrl
            ? <img src={avatarUrl} width={28} height={28} style={{display:'block',borderRadius:'50%',objectFit:'cover'}} alt="avatar" onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';onAvatarBroken&&onAvatarBroken();}} />
            : null}
          <span style={{fontSize:11,fontWeight:700,color:'#fff',letterSpacing:'0.02em',display:avatarUrl?'none':'flex',alignItems:'center',justifyContent:'center',width:'100%',height:'100%',background:t.accent,borderRadius:'50%'}}>{initial}</span>
        </button>
      </div>

      {tab==='home'     &&<HomeTab     dark={dark} amount={amount} yearIncome={yearIncome} yearReview={yearReview} earnings={earnings} onAddEarnings={onAddEarnings} assets={assets} onAddAssets={onAddAssets} daysUntil={daysUntil} paymentDate={paymentDate} paid={paid} onPaidChange={onPaidChange} reportMonths={reportMonths} onSubmitReport={()=>setShowSubmit(true)} onMarkFiled={onMarkFiled} pwdApproved={pwdApproved}/>}
      {tab==='calendar' &&<CalendarTab dark={dark} payDateObj={payDateObj} amount={amount} daysUntil={daysUntil}/>}
      {tab==='status'   &&<StatusTab   dark={dark} pwdApproved={pwdApproved} pwdMedicalDone={pwdMedicalDone} pwdStatus={pwdStatus} pwdDeniedDate={pwdDeniedDate} rdspStatus={rdspStatus} rdspAccountOpenedDate={rdspAccountOpenedDate} rdspAccountNumber={rdspAccountNumber} cdbStatus={cdbStatus} cdbAppliedDate={cdbAppliedDate} cdbApprovalDate={cdbApprovalDate} cdbMonthlyAmount={cdbMonthlyAmount} cdbRetroactiveEligible={cdbRetroactiveEligible} cgeb={cgeb} skn={skn} onSubmitReport={()=>setShowSubmit(true)} onPwdResubmit={()=>setShowPwdResubmit(true)} reportMonths={reportMonths} username={username} pinSet={pinSet} onSetPin={()=>setShowPinSheet(true)}/>}
      {tab==='messages' &&<MessagesTab dark={dark} messages={messages} readIds={readIds} onRead={onRead} onRefresh={onRefresh}/>}
      {tab==='legal'    &&<LegalTab dark={dark}/>}
      {tab==='settings' &&<SettingsTab dark={dark} username={username} avatarUrl={avatarUrl} onAvatarBroken={onAvatarBroken} onAvatarRefresh={doRefresh} refreshing={refreshing} avatarError={avatarError} setAvatarError={setAvatarError} onLogout={onLogout}/>}

      <TabBar tab={tab} setTab={setTab} dark={dark} msgBadge={unread}/>
      {showSubmit&&<SubmitReportModal dark={dark} skn={skn} pinSet={pinSet} onPinSaved={()=>setPinSet(true)} onClose={()=>setShowSubmit(false)}/>}
      {showPwdResubmit&&<PwdResubmitModal dark={dark} pwdDeniedDate={pwdDeniedDate} onClose={()=>setShowPwdResubmit(false)} onResubmitted={onPwdResubmitted}/>}
      {showPinSheet&&<PinSheet dark={dark} onClose={()=>setShowPinSheet(false)} onSaved={()=>{setPinSet(true);setShowPinSheet(false);}}/>}
    </div>
  );
}

// ════════════════════════════════════════════════════
// APP (data fetching)
// ════════════════════════════════════════════════════
function App() {
  const [dark,        setDark]        = useState(window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [username,    setUsername]    = useState('');
  const [amount,      setAmount]      = useState(null);
  const [yearIncome,  setYearIncome]  = useState(null);
  const [earnings,    setEarnings]    = useState(null);
  const [assets,      setAssets]      = useState(null);
  const [yearReview,  setYearReview]  = useState(null);
  const [daysUntil,   setDaysUntil]   = useState(null);
  const [paymentDate, setPaymentDate] = useState('');
  const [payDateObj,  setPayDateObj]  = useState(null);
  const [paidMonths,  setPaidMonths]  = useState({});
  const [messages,    setMessages]    = useState([]);
  const [pwdApproved, setPwdApproved] = useState(false);
  const [pwdMedicalDone, setPwdMedicalDone] = useState(false);
  const [pwdStatus, setPwdStatus] = useState('applied');
  const [pwdDeniedDate, setPwdDeniedDate] = useState(null);
  const [rdspStatus, setRdspStatus] = useState('pending');
  const [rdspAccountOpenedDate, setRdspAccountOpenedDate] = useState(null);
  const [rdspAccountNumber, setRdspAccountNumber] = useState(null);
  const [cdbStatus, setCdbStatus] = useState('pending');
  const [cdbAppliedDate, setCdbAppliedDate] = useState(null);
  const [cdbApprovalDate, setCdbApprovalDate] = useState(null);
  const [cdbMonthlyAmount, setCdbMonthlyAmount] = useState(null);
  const [cdbRetroactiveEligible, setCdbRetroactiveEligible] = useState(false);
  const [cgeb, setCgeb] = useState(null);
  const [avatarUrl,   setAvatarUrl]   = useState(() => localStorage.getItem('talliAvatarUrl') || null);
  const [avatarError, setAvatarError] = useState(null);
  const [skn,         setSkn]         = useState(null);
  const [reportMonths, setReportMonths] = useState({});
  const [pinSet, setPinSet] = useState(false);
  const [showPinSheet, setShowPinSheet] = useState(false);
  const [readIds, setReadIds] = useState({});

  const mergeReadIds = useCallback((ids) => {
    setReadIds(prev => {
      const next = {...prev};
      ids.forEach(id => { next[id] = true; });
      return next;
    });
  }, []);

  async function fetchWithSessionRetry(url, opts, retries = 2) {
    for (let i = 0; i <= retries; i++) {
      const r = await fetch(url, opts);
      if (r.status !== 401 || i === retries) return r;
      await new Promise(res => setTimeout(res, 1500));
    }
  }

  const loadData = useCallback(async () => {
    try {
      const r = await fetchWithSessionRetry('/api/latest', {credentials:'include'});
      if (r.status===401) { _talliBounceToLogin(); return; }
      if (!r.ok) return;
      const json = await r.json();
      const sections = json.data?.sections || json.sections || {};
      const pi  = sections['Payment Info'] || {};
      const raw = [...(pi.tableData||[]), ...(pi.allText||[])].join('\n');
      // Income comes from deriveIncome() on the server (PWD + CDB), not the portal's
      // Payment Info line -- My Self Serve only ever shows the provincial PWD half, so
      // scraping it silently dropped the federal CDB and showed a low monthly total.
      const total = json.uiConfig?.income?.totalMonthly;
      if (total != null) setAmount('$' + total.toLocaleString('en-CA'));
      else setAmount(prev => prev ?? '$0');
      setYearIncome(json.uiConfig?.income ?? null);
      setEarnings(json.uiConfig?.earnings ?? null);
      setAssets(json.uiConfig?.assets ?? null);
      setYearReview(json.uiConfig?.yearReview ?? null);
      const dm = raw.match(/(\d{4})\s*\/\s*([A-Z]{3})\s*\/\s*(\d{2})/);
      const _now = new Date(); _now.setHours(0,0,0,0);
      let payDate;
      if (dm) {
        let d = new Date(+dm[1], MON[dm[2]], +dm[3]);
        if (d < _now) d = nextScheduledPayDate(d);
        payDate = d;
      } else {
        payDate = nextScheduledPayDate(_now);
      }
      setPayDateObj(payDate);
      setDaysUntil(Math.max(0, Math.ceil((payDate - _now) / 86400000)));
      setPaymentDate(payDate.toLocaleDateString('en-CA', {weekday:'short',month:'short',day:'numeric'}));
      setMessages(parseMessages(sections));
      setPwdApproved(json.uiConfig?.pwdApproved||false);
      setPwdMedicalDone(json.uiConfig?.pwdMedicalDone||false);
      setPwdStatus(json.uiConfig?.pwdStatus||'applied');
      setPwdDeniedDate(json.uiConfig?.pwdDeniedDate||null);
      setRdspStatus(json.uiConfig?.rdspStatus||'pending');
      setRdspAccountOpenedDate(json.uiConfig?.rdspAccountOpenedDate||null);
      setRdspAccountNumber(json.uiConfig?.rdspAccountNumber||null);
      setCdbStatus(json.uiConfig?.cdbStatus||'pending');
      setCdbAppliedDate(json.uiConfig?.cdbAppliedDate||null);
      setCdbApprovalDate(json.uiConfig?.cdbApprovalDate||null);
      setCdbMonthlyAmount(json.uiConfig?.cdbMonthlyAmount||null);
      setCdbRetroactiveEligible(json.uiConfig?.cdbRetroactiveEligible||false);
      setCgeb(json.uiConfig?.cgeb||null);
      fetch('/api/read-messages', {credentials:'include'})
        .then(r=>r.json()).then(d=>{ if(d.readIds?.length) mergeReadIds(d.readIds); }).catch(()=>{});
    } catch(e) { setAmount(v=>v??'$0'); setDaysUntil(v=>v??0); }
  }, []);

  useEffect(() => {
    document.body.dataset.dark = dark;
  }, [dark]);

  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const mqH = e => setDark(e.matches);
    mq.addEventListener('change', mqH);
    (async () => {
      try {
        const r = await fetchWithSessionRetry('/api/me', {credentials:'include'});
        if (r.status===401) { _talliBounceToLogin(); return; }
        if (!r.ok) { _talliScriptError(); return; }
        const d = await r.json();
        if (!d.authenticated) { _talliBounceToLogin(); return; }
        try { sessionStorage.removeItem('talliBounced'); } catch (e) {}
        setUsername(d.username);
        loadData();
        fetch('/api/paid-status',{credentials:'include'}).then(r=>r.json()).then(d=>setPaidMonths(d.paidMonths||{})).catch(()=>{});
        fetch('/api/report-status',{credentials:'include'}).then(r=>r.json()).then(d=>setReportMonths(d.reportMonths||{})).catch(()=>{});
        // Auto-scrape once per 6h during filing window (days 1-5) so MYSS messages appear automatically
        (()=>{
          const day=new Date().getDate();
          if(day>=1&&day<=5){
            const k='talliLastAutoScrape';
            const last=parseInt(localStorage.getItem(k)||'0');
            if(Date.now()-last>6*60*60*1000){
              localStorage.setItem(k,String(Date.now()));
              fetch('/api/check',{method:'POST',credentials:'include'}).then(()=>{
                loadData();
                fetch('/api/report-status',{credentials:'include'}).then(r=>r.json()).then(d=>setReportMonths(d.reportMonths||{})).catch(()=>{});
              }).catch(()=>{});
            }
          }
        })();
        fetch('/api/profile',{credentials:'include'}).then(r=>r.json()).then(p=>{
          const persistAvatar = (url) => { setAvatarUrl(url); localStorage.setItem('talliAvatarUrl', url); };
          if(p.avatarUrl) persistAvatar(p.avatarUrl);
          else {
            // No avatar yet -- generate and save one silently
            const svg = generateNodeGraphSVG();
            const b64 = btoa(unescape(encodeURIComponent(svg)));
            persistAvatar(`data:image/svg+xml;base64,${b64}`);
            fetch('/api/avatar',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({svgBase64:b64})})
              .then(r=>r.json()).then(res=>{ if(res.avatarUrl) persistAvatar(res.avatarUrl); }).catch(()=>{});
          }
          if(p.skn) setSkn(p.skn);
          setPinSet(p.pinSet || false);
        }).catch(()=>{});
      } catch(e) { console.error('[talli] dashboard bootstrap failed', e); _talliScriptError(); }
    })();
    const clearPoll = visibilityInterval(loadData, 120000);
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(console.error));
    return () => { mq.removeEventListener('change',mqH); clearPoll(); };
  }, [loadData]);

  const now      = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const paid     = !!paidMonths[monthKey];

  const handlePaidChange = async (newPaid) => {
    setPaidMonths(prev=>({...prev,[monthKey]:newPaid?Date.now():null}));
    try { await fetch('/api/paid-status',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({month:monthKey,paid:newPaid})}); } catch(e){}
  };

  const handleLogout = async () => {
    try { const r=await fetch('/api/logout',{method:'POST',credentials:'same-origin'}); if(r.ok)location.href='/login.html'; } catch(e){}
  };

  const handleAvatarClick = async () => {
    const svg = generateNodeGraphSVG();
    const b64 = btoa(unescape(encodeURIComponent(svg)));
    const previewUrl = `data:image/svg+xml;base64,${b64}`;
    setAvatarUrl(previewUrl);
    try {
      const r = await fetch('/api/avatar',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({svgBase64:b64})});
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      if(d.error) throw new Error(d.error);
      if(d.avatarUrl) { setAvatarUrl(d.avatarUrl); localStorage.setItem('talliAvatarUrl', d.avatarUrl); setAvatarError(null); }
      else throw new Error('No avatar URL in response');
    } catch (err) {
      setAvatarUrl(previewUrl);
      setAvatarError('Failed to save avatar. Please try again.');
      console.error('[AVATAR] Error:', err.message);
    }
  };

  // Saved avatar URL 404s (blob deleted / stale profile) -- drop it and regenerate
  // once, so a broken URL self-heals instead of falling back to the letter icon forever.
  const avatarHealedRef = useRef(false);
  const handleAvatarBroken = () => {
    if (avatarHealedRef.current) return; // ponytail: once per load, no regen loop if POST keeps failing
    avatarHealedRef.current = true;
    localStorage.removeItem('talliAvatarUrl');
    handleAvatarClick();
  };

  const handlePwdResubmitted = () => setPwdStatus('resubmitted');

  const handleMarkFiled = async (month) => {
    try {
      await fetch('/api/report-status',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({month,filed:true})});
      fetch('/api/report-status',{credentials:'include'}).then(r=>r.json()).then(d=>setReportMonths(d.reportMonths||{})).catch(()=>{});
    } catch(e){}
  };

  const handleAddEarningsEntry = async (date, amount) => {
    try {
      const existing = await fetch('/api/earnings-profile',{credentials:'include'}).then(r=>r.json()).catch(()=>({entries:[]}));
      const entries = [...(existing.entries || []), {date, amount: parseFloat(amount)}];
      await fetch('/api/earnings-profile',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries})});
      loadData();
    } catch(e){console.error('Failed to add earnings entry',e);}
  };

  const handleAddAccountsAsset = async (name, balance, exempt) => {
    try {
      const existing = await fetch('/api/assets-profile',{credentials:'include'}).then(r=>r.json()).catch(()=>({accounts:[]}));
      const accounts = [...(existing.accounts || []), {name, balance: parseFloat(balance), exempt}];
      await fetch('/api/assets-profile',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({accounts})});
      loadData();
    } catch(e){console.error('Failed to add asset account',e);}
  };

  return (
    <>
    <Screen dark={dark} amount={amount} yearIncome={yearIncome} yearReview={yearReview} earnings={earnings} onAddEarnings={handleAddEarningsEntry} assets={assets} onAddAssets={handleAddAccountsAsset} daysUntil={daysUntil} paymentDate={paymentDate} payDateObj={payDateObj} paid={paid} onPaidChange={handlePaidChange} messages={messages} readIds={readIds} onRead={mergeReadIds} onRefresh={loadData} pwdApproved={pwdApproved} pwdMedicalDone={pwdMedicalDone} pwdStatus={pwdStatus} pwdDeniedDate={pwdDeniedDate} rdspStatus={rdspStatus} rdspAccountOpenedDate={rdspAccountOpenedDate} rdspAccountNumber={rdspAccountNumber} cdbStatus={cdbStatus} cdbAppliedDate={cdbAppliedDate} cdbApprovalDate={cdbApprovalDate} cdbMonthlyAmount={cdbMonthlyAmount} cdbRetroactiveEligible={cdbRetroactiveEligible} cgeb={cgeb} username={username} onLogout={handleLogout} avatarUrl={avatarUrl} onAvatarClick={handleAvatarClick} onAvatarBroken={handleAvatarBroken} setAvatarError={setAvatarError} skn={skn} reportMonths={reportMonths} onMarkFiled={handleMarkFiled} onPwdResubmitted={handlePwdResubmitted} pinSet={pinSet} setPinSet={setPinSet} showPinSheet={showPinSheet} setShowPinSheet={setShowPinSheet}/>
    </>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error:null}; }
  static getDerivedStateFromError(e) { return {error:e}; }
  render() {
    if (this.state.error) return React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100dvh',gap:'1rem',fontFamily:'inherit',color:'#737373',fontSize:'0.9rem'}},
      React.createElement('div',null,'Something went wrong. Please reload.'),
      React.createElement('button',{onClick:()=>location.reload(),style:{padding:'0.5rem 1.25rem',border:'1px solid #e5e5e5',borderRadius:'6px',background:'#fff',cursor:'pointer',fontSize:'0.875rem'}},'Reload')
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(ErrorBoundary, null, React.createElement(App))
);
</script>
</body>
</html>
