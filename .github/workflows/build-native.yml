name: Build native apps

on:
  push:
    branches: [main]
    paths:
      - 'kmp/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  # jpackage only builds an installer for the OS it runs on, so the .msi and .deb
  # cannot come off a Mac -- these jobs are the only way to get them.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the Windows installer
        working-directory: kmp
        run: ./gradlew packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: talli-windows-msi
          path: kmp/composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the Debian package
        working-directory: kmp
        run: ./gradlew packageDeb
      - uses: actions/upload-artifact@v4
        with:
          name: talli-linux-deb
          path: kmp/composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test the shared client
        working-directory: kmp
        run: ./gradlew :shared:jvmTest
      - name: Build the APK
        working-directory: kmp
        run: ./gradlew :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: talli-android-apk
          path: kmp/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
